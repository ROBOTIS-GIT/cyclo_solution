# The name of the workflow
name: CI

# Specifies the events that trigger the workflow
on:
  push:
    branches: [ jazzy, main ]
  pull_request:
    branches: [ jazzy, main ]

# Defines a set of jobs to be run as part of the workflow
jobs:
  # The name of the job
  ROS_CI:
    runs-on: ubuntu-22.04
    env:
      NVIDIA_ROSDEP_SKIP_KEYS: >-
        isaac_ros_common
        isaac_ros_cumotion
        isaac_ros_cumotion_interfaces
        isaac_ros_cumotion_moveit
        isaac_ros_cumotion_object_attachment
        isaac_ros_nitros
        isaac_ros_nitros_image_type
        nvblox_msgs
        nvblox_ros
    strategy:
      fail-fast: false
      matrix:
        ros_distribution:
          # - humble
          - jazzy
          # - rolling
        include:
          # ROS 2 Humble Hawksbill
          # - docker_image: ubuntu:jammy
            # ros_distribution: humble
            # ros_version: 2
          # ROS 2 Jazzy Jalisco
          - docker_image: nvidia/cuda:13.2.0-devel-ubuntu24.04
            ros_distribution: jazzy
            ros_version: 2
          # ROS 2 Rolling Ridley
          # - docker_image: ubuntu:noble
          #   ros_distribution: rolling
          #   ros_version: 2
    container:
      image: ${{ matrix.docker_image }}
    steps:
      - name: Setup workspace
        run: mkdir -p ros_ws/src

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: ros_ws/src

      - name: Setup ROS environment
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distribution }}

      - name: Setup NVIDIA repositories
        shell: bash
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends curl gnupg software-properties-common
          add-apt-repository -y universe
          curl -fsSL https://isaac.download.nvidia.com/isaac-ros/repos.key | \
            gpg --dearmor --yes -o /usr/share/keyrings/nvidia-isaac-ros.gpg
          echo "deb [signed-by=/usr/share/keyrings/nvidia-isaac-ros.gpg] https://isaac.download.nvidia.com/isaac-ros/release-4.6 noble main" \
            > /etc/apt/sources.list.d/nvidia-isaac-ros.list
          mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.download.nvidia.com/jetson/jetson-ota-public.asc | \
            gpg --dearmor --yes -o /etc/apt/keyrings/nvidia-jetson.gpg
          echo "deb [signed-by=/etc/apt/keyrings/nvidia-jetson.gpg] https://repo.download.nvidia.com/jetson/x86_64/noble r39.2 main" \
            > /etc/apt/sources.list.d/nvidia-jetson-apt-source.list
          apt-mark unhold libcublas-13-2 libcublas-dev-13-2 2>/dev/null || true
          apt-get update
          apt-get -o Dpkg::Options::="--force-confold" install -y --no-install-recommends \
            ros-${{ matrix.ros_distribution }}-isaac-ros-cumotion-moveit \
            ros-${{ matrix.ros_distribution }}-isaac-ros-cumotion-object-attachment \
            ros-${{ matrix.ros_distribution }}-isaac-ros-cumotion-robot-segmenter \
            ros-${{ matrix.ros_distribution }}-nvblox-ros

      - name: Check and Install ROS dependencies
        shell: bash
        run: |
          set -e
          source /opt/ros/${{ matrix.ros_distribution }}/setup.bash
          echo "--- Updating rosdep definitions ---"
          rosdep update
          echo "--- Installing system dependencies for ROS 2 ${{ matrix.ros_distribution }} ---"
          rosdep install --from-paths ros_ws/src --ignore-src -y -r --rosdistro ${{ matrix.ros_distribution }} \
            --skip-keys "robotis_interfaces ${NVIDIA_ROSDEP_SKIP_KEYS}"
          echo "--- Performing rosdep check for ROS 2 ${{ matrix.ros_distribution }} ---"
          if rosdep check --from-paths ros_ws/src --ignore-src --rosdistro ${{ matrix.ros_distribution }} \
            --skip-keys "robotis_interfaces ${NVIDIA_ROSDEP_SKIP_KEYS}"; then
            echo "--- rosdep check passed ---"
          else
            echo "--- rosdep check failed: Missing system dependencies or unresolvable keys. ---"
            exit 1
          fi

      - name: Build and Test
        uses: ros-tooling/action-ros-ci@v0.3
        with:
          target-ros2-distro: ${{ matrix.ros_distribution }}
          vcs-repo-file-url: "https://raw.githubusercontent.com/ROBOTIS-GIT/cyclo_solution/${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}/cyclo_solution_ci.repos"
          rosdep-skip-keys: ${{ env.NVIDIA_ROSDEP_SKIP_KEYS }}
          package-name: |
            cyclo_cumotion_bringup
            cyclo_cumotion_description
            cyclo_cumotion_moveit_config
            cyclo_cumotion_nvblox
            cyclo_cumotion_object_attachment
            cyclo_cumotion_robot_segmenter
