          blend_with_next: true
          velocity_scale: 0.4
          acceleration_scale: 0.4
          left_target:
          - 0.13507745
          - 0.91394382
          - -0.30582384
          - -1.665228
          - 0.83815159
          - -0.31098775
          - -1.29669374
          right_target:
          - -0.18441049
          - -0.83519439
          - 0.21086751
          - -1.4514526
          - -1.63022887
          - 1.49778519
          - 0.79315651
