services:
  cyclo_solution:
    container_name: cyclo_solution
    image: robotis/cyclo-solution:0.1.0
    tty: true
    restart: always
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../:/root/ros2_ws/src/cyclo_solution/
    privileged: true
    gpus: all
